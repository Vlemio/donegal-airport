title: Sustainability at Donegal Airport.
date: 2025-07-02
kind: Sustainability
image: news-aca-level4.jpg
imagePosition: 50% 50%
lead: >-
  Donegal was the first airport in Ireland to reach Level 4 (Transformation) in
  the Airport Carbon Accreditation programme.
body: >
  The airport's environmental work goes back to 2018, when it joined EcoMerit,
  reaching certification in 2019. It's also a member of the global Airport
  Carbon Accreditation (ACA) scheme, run by Airports Council International —
  and in 2024 became the first airport on the island of Ireland to reach Level
  4 (Transformation), the highest tier in the programme.


  The target is a 7% annual reduction in carbon footprint, measured against a
  2017 baseline and aligned with the Paris Agreement, with net-zero emissions
  no later than 2050 in line with government climate legislation. Recent
  infrastructure work includes LED conversion of runway and building lighting
  with motion sensors, rainwater harvesting, solar panel installations in 2023
  and 2025, electric ground support vehicles, upgraded terminal insulation, and
  heat pump water systems.


  The 2026 EcoMerit review found the airport on target with its carbon
  reduction goals, with measurement now expanding to cover Scope 3 emissions —
  business and staff travel. Planned next steps include further EV fleet
  expansion, sensor-controlled water fittings, departure lounge heating
  upgrades, and an exploration of onsite wind turbines.
titleGa: Inbhuanaitheacht ag Aerfort Dhún na nGall.
kindGa: Inbhuanaitheacht
leadGa: >-
  Ba é Dún na nGall an chéad aerfort in Éirinn a bhain Leibhéal 4 (Claochlú)
  amach i gclár Chreidiúnú Carbóin Aerfoirt.
bodyGa: >
  Téann obair chomhshaoil an aerfoirt siar go dtí 2018, nuair a chuaigh sé
  isteach in EcoMerit, ag baint deimhniúcháin amach in 2019. Tá sé ina bhall
  freisin de scéim dhomhanda Chreidiúnú Carbóin Aerfoirt (ACA), atá á
  reáchtáil ag Airports Council International — agus in 2024 ba é an chéad
  aerfort ar oileán na hÉireann é a bhain Leibhéal 4 (Claochlú) amach, an
  leibhéal is airde sa chlár.


  Is í an sprioc laghdú 7% in aghaidh na bliana ar an lorg carbóin, arna
  thomhas i gcoinne bonnlíne 2017 agus ailínithe le Comhaontú Pháras, le
  hastaíochtaí net-nialas faoi 2050 ar a dhéanaí de réir reachtaíocht aeráide
  an rialtais. I measc na hoibre bonneagair le déanaí tá tiontú LED ar
  shoilsiú an rúidbhealaigh agus na bhfoirgneamh le braiteoirí gluaiseachta,
  bailiú uisce báistí, suiteálacha painéal gréine in 2023 agus 2025,
  feithiclí tacaíochta talún leictreacha, feabhsú inslithe an teirminéil,
  agus córais uisce le caidéil teasa.


  Fuair athbhreithniú EcoMerit 2026 go raibh an t-aerfort ar sprioc lena
  chuspóirí laghdaithe carbóin, leis an tomhas anois ag leathnú chun
  Astaíochtaí Scóip 3 a chumhdach — taisteal gnó agus foirne. I measc na
  gcéad chéimeanna eile atá beartaithe tá leathnú breise ar an bhflít
  feithiclí leictreacha, feistis uisce á rialú ag braiteoirí, uasghráduithe
  téimh sa tolglann imeachta, agus iniúchadh ar thuirbíní gaoithe ar an
  láthair.
