title: "Bucket list landings: world's most stunning runway."
date: 2018-04-17
kind: Awards
image: news-bucket-list-landings-2018.png
imagePosition: 50% 50%
lead: >-
  PrivateFly's 2018 poll of over 8,500 travellers named Donegal the world's
  most beautiful landing.
body: >
  PrivateFly's 2018 scenic airports poll surveyed more than 8,500
  international travellers and ranked Donegal Airport the world's most
  beautiful landing spot. PrivateFly CEO Adam Twidell called Donegal
  "extraordinarily beautiful," citing its rugged coastal landscapes.
titleGa: "Tuirlingtí is fiú a fheiceáil: an rúidbhealach is suaithinsí ar domhan."
kindGa: Dámhachtainí
leadGa: >-
  D'ainmnigh pobalbhreith PrivateFly 2018, ina raibh breis agus 8,500
  taistealaí páirteach, Dún na nGall mar an tuirlingt is áille ar domhan.
bodyGa: >
  Rinne pobalbhreith aerfoirt álainn PrivateFly 2018 suirbhé ar bhreis agus
  8,500 taistealaí idirnáisiúnta agus rangaigh siad Aerfort Dhún na nGall
  mar an áit tuirlingthe is áille ar domhan. Thug Adam Twidell, Príomhfheidhmeannach
  PrivateFly, "urghnách álainn" ar Dhún na nGall, ag lua a chuid tírdhreacha
  garbha cois cósta.
