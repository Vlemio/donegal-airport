title: Minister confirms €367,000 funding under the Regional Airports Programme.
date: 2026-04-30
kind: Operations
image: news-regional-airport-programme.jpg
imagePosition: 50% 50%
lead: >-
  The Chairman welcomed the announcement, which covers safety, security and
  carbon-reduction works through to 2030.
body: >
  Minister for Transport Darragh O'Brien confirmed €367,000 in funding for
  Donegal Airport under the Government's Regional Airports Programme
  2026–2030. The investment supports safety and security improvements and
  helps the airport meet its carbon-reduction targets.


  The announcement also confirmed that the afternoon Donegal–Dublin service
  would be restored from 1 May 2026, giving passengers more scheduling
  flexibility on the route.
titleGa: An tAire ag deimhniú maoiniú €367,000 faoin gClár Aerfoirt Réigiúnacha.
kindGa: Oibríochtaí
leadGa: >-
  Fáiltíonn Cathaoirleach, Bord Stiúrthóirí agus Bainistíocht Aerfort Dhún na
  nGall roimh fhógra an Aire Iompair, Darragh O'Brien, gur ceadaíodh €367,000
  d'infheistíocht i dtionscadail chaipitil ag an aerfort.
bodyGa: >
  Tá an maoiniú sin á chur ar fáil mar chuid de Chlár Aerfoirt Réigiúnacha an
  Rialtais 2026-2030 agus tacóidh sé le hinfheistíocht i dtionscadail a
  bhaineann le sábháilteacht agus slándáil ag an aerfort. Ina theannta sin,
  cuideoidh an infheistíocht leis an aerfort spriocanna laghdaithe carbóin a
  bhaint amach san am atá le teacht.


  Chomh maith leis sin, tá lúcháir orainn go bhfuil an tseirbhís iarnóin ar
  ais ar bhealach Dhún na nGall go Baile Átha Cliath, ag tosú ón 1 Bealtaine
  2026. Tugann an t-athbhunú seo solúbthacht ríthábhachtach dár bpaisinéirí,
  rud a chinntíonn go bhfuil Dún na nGall nasctha i dtaca le cuspóirí taistil
  gnó agus fóillíochta araon.
