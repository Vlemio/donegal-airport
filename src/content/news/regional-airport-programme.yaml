title: Minister confirms €367,000 funding under the Regional Airports Programme.
date: 2026-04-30
kind: Operations
image: news-regional-airport-programme.jpg
imagePosition: 50% 50%
lead: >-
  The Chairman welcomed the announcement, which covers safety, security and
  carbon-reduction works through to 2030.
body: >
  Minister for Transport Darragh O'Brien confirmed €367,000 in funding for
  Donegal Airport under the Government's Regional Airports Programme
  2026–2030. The investment supports safety and security improvements and
  helps the airport meet its carbon-reduction targets.


  The announcement also confirmed that the afternoon Donegal–Dublin service
  would be restored from 1 May 2026, giving passengers more scheduling
  flexibility on the route.
