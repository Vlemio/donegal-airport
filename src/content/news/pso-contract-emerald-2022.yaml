title: New PSO contract with Emerald Airlines announced.
date: 2022-01-07
kind: Operations
image: news-pso-contract-emerald-2022.jpg
imagePosition: 50% 50%
lead: >-
  Emerald Airlines took over the Dublin–Donegal PSO route from
  26 February 2022, flying ATR72-600 aircraft.
body: >
  Donegal Airport announced that Emerald Airlines would operate the Public
  Service Obligation route between Dublin and Donegal from 26 February 2022,
  replacing the interim service run by Amapola Flyg AB since July 2021.
  Emerald maintained twice-daily flights on the route, deploying ATR72-600
  aircraft with increased passenger capacity to support the region's
  post-pandemic recovery.
titleGa: Conradh nua PSO le Emerald Airlines fógartha.
kindGa: Oibríochtaí
leadGa: >-
  Ghlac Emerald Airlines seilbh ar bhealach PSO Bhaile Átha Cliath–Dhún na
  nGall ón 26 Feabhra 2022, ag eitilt aerárthaí ATR72-600.
bodyGa: >
  D'fhógair Aerfort Dhún na nGall go n-oibreodh Emerald Airlines an bealach
  Oibleagáide Seirbhíse Poiblí idir Baile Átha Cliath agus Dún na nGall ón 26
  Feabhra 2022, ag teacht in áit na seirbhíse eatramhaí a bhí á reáchtáil ag
  Amapola Flyg AB ó mhí Iúil 2021. Choinnigh Emerald eitiltí faoi dhó sa lá
  ar an mbealach, ag úsáid aerárthaí ATR72-600 le hacmhainn paisinéirí
  méadaithe chun tacú le hathshlánú an réigiúin i ndiaidh na paindéime.
