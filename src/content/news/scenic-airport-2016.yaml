title: Donegal voted one of the world's top 10 scenic airports.
date: 2020-09-05
kind: Awards
image: news-scenic-airport-2016.jpg
imagePosition: 50% 50%
lead: PrivateFly's 2016 poll ranked Donegal 7th among the world's most scenic landings.
body: >
  PrivateFly's 2016 poll ranked Donegal Airport the seventh most scenic
  airport landing in the world. Voters praised the breathtaking, rugged
  coastline, turquoise waters, and the backdrop of Mount Errigal as an
  unforgettable introduction to Ireland.
titleGa: Roghnaíodh Dún na nGall i measc na 10 n-aerfort is áille ar domhan.
kindGa: Dámhachtainí
leadGa: >-
  Rangaigh pobalbhreith PrivateFly 2016 Dún na nGall sa 7ú háit i measc na
  dtuirlingtí is áille ar domhan.
bodyGa: >
  Rangaigh pobalbhreith PrivateFly 2016 Aerfort Dhún na nGall mar an seachtú
  tuirlingt aerfoirt is áille ar domhan. Mhol vótálaithe an cladach garbh a
  bhaineann an anáil díot, na huiscí atá gorm-uaine, agus cúlra Shliabh an
  Earagail mar réamhrá dobhearctha ar Éirinn.
