title: Loganair to deliver year-round connectivity for Donegal.
date: 2024-03-09
kind: Operations
image: news-loganair-announcement-2024.jpg
imagePosition: 50% 50%
lead: The Glasgow route, relaunched in 2023, was confirmed to run year-round.
body: >
  Donegal Airport announced that Loganair would extend its Glasgow route to
  year-round service, building on the route's 2023 relaunch and giving the
  north-west a consistent link to Scotland across all seasons.
titleGa: Tá sceideal samhraidh agus geimhridh fógartha ag Loganair do 2024!
kindGa: Oibríochtaí
leadGa: >-
  Deimhníodh go rithfeadh bealach Ghlaschú, a athsheoladh in 2023, ar
  feadh na bliana.
bodyGa: >
  Tá sceideal an tsamhraidh do 2024 fógartha ag Loganair! Beidh an tseirbhís ó
  Dhún na nGall go Glaschú ar fáil ón 19 Bealtaine, Dé Céadaoin, Dé hAoine, Dé
  Sathairn, agus Dé Domhnaigh (Dé Sathairn 6 Iúil agus 17 Lúnasa). Tá níos mó
  solúbthachta agus é níos furasta ag daoine agus iad ag pleanáil a dturais
  chuig agus ó Dhún na nGall, agus sin mar thoradh ar líon méadaithe na
  n-eitiltí a chuireann Loganair ar fáil. Leanfaidh sé seo ar aghaidh tríd an
  ngeimhreadh, le heitiltí gach Aoine agus Domhnach. Cumasóidh sé seo turais
  deireadh seachtaine agus cuirfidh sé naisc ríthábhachtacha ar fáil i rith na
  bliana. Is féidir eitiltí idir Dún na nGall agus Glaschú a chur in áirithe
  ag www.loganair.co.uk
