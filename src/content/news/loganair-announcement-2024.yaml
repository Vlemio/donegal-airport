title: Loganair to deliver year-round connectivity for Donegal.
date: 2024-03-09
kind: Operations
image: news-loganair-announcement-2024.jpg
imagePosition: 50% 50%
lead: The Glasgow route, relaunched in 2023, was confirmed to run year-round.
body: >
  Donegal Airport announced that Loganair would extend its Glasgow route to
  year-round service, building on the route's 2023 relaunch and giving the
  north-west a consistent link to Scotland across all seasons.
