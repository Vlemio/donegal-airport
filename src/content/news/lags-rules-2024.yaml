title: Changes to liquids, aerosols and gels (LAGS) rules.
date: 2024-08-27
kind: Operations
image: news-lags-rules-2024.png
imagePosition: 50% 50%
lead: New EU rules changed how liquids and gels are screened at security.
body: >
  From 1 September 2024, new EU regulations changed how liquids, aerosols and
  gels are screened at Donegal Airport. Containers of 100ml or less can now
  go through security without a plastic bag. Larger containers are only
  permitted for baby food, milk, medicines or special dietary requirements,
  and are subject to additional screening — everything else over 100ml must
  go in checked baggage or be disposed of before security.
titleGa: Athruithe ar rialacha leachtanna, aerasóil agus glóthach (LAGS).
kindGa: Oibríochtaí
leadGa: >-
  D'athraigh rialacháin nua AE conas a scagtar leachtanna agus glóthaigh ag
  an slándáil.
bodyGa: >
  Ón 1 Meán Fómhair 2024, d'athraigh rialacháin nua AE conas a scagtar
  leachtanna, aerasóil agus glóthaigh ag Aerfort Dhún na nGall. Is féidir le
  coimeádáin 100ml nó níos lú dul tríd an slándáil anois gan mhála plaisteach.
  Ní cheadaítear coimeádáin níos mó ach amháin do bhia linbh, bainne, cógais
  nó riachtanais speisialta bia, agus tá siad faoi réir scagadh breise —
  caithfidh gach rud eile os cionn 100ml a chur i mbagáiste seiceáilte nó a
  dhiúscairt roimh an slándáil.
