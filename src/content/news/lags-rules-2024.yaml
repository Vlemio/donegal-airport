title: Changes to liquids, aerosols and gels (LAGS) rules.
date: 2024-08-27
kind: Operations
image: news-lags-rules-2024.png
imagePosition: 50% 50%
lead: New EU rules changed how liquids and gels are screened at security.
body: >
  From 1 September 2024, new EU regulations changed how liquids, aerosols and
  gels are screened at Donegal Airport. Containers of 100ml or less can now
  go through security without a plastic bag. Larger containers are only
  permitted for baby food, milk, medicines or special dietary requirements,
  and are subject to additional screening — everything else over 100ml must
  go in checked baggage or be disposed of before security.
