title: Connections Corridor.
date: 2022-06-22
kind: Operations
image: /photos/connections-corridor/image.jpg
imagePosition: 50% 50%
lead: >-
  Dublin Airport's new Connections Corridor cuts queuing for passengers
  connecting onward from Donegal.
body: >
  Donegal Airport welcomed the launch of the Flight Connections Corridor at
  Dublin Airport, which lets self-connecting passengers travelling with cabin
  baggage only reach their departure gate without clearing Immigration and
  Security Screening again. For passengers connecting through Dublin to
  destinations worldwide on the twice-daily service from Donegal, it means less
  time queuing.
