title: Connections Corridor.
date: 2022-06-22
kind: Operations
image: /photos/connections-corridor/image.jpg
imagePosition: 50% 50%
lead: >-
  Dublin Airport's new Connections Corridor cuts queuing for passengers
  connecting onward from Donegal.
body: >
  Donegal Airport welcomed the launch of the Flight Connections Corridor at
  Dublin Airport, which lets self-connecting passengers travelling with cabin
  baggage only reach their departure gate without clearing Immigration and
  Security Screening again. For passengers connecting through Dublin to
  destinations worldwide on the twice-daily service from Donegal, it means less
  time queuing.
titleGa: Conair na Nasceitiltí.
kindGa: Oibríochtaí
leadGa: >-
  Laghdaíonn Conair na Nasceitiltí nua ag Aerfort Bhaile Átha Cliath amanna
  scuaine do phaisinéirí atá ag nascadh ar aghaidh ó Dhún na nGall.
bodyGa: >
  Tá an-áthas ar Aerfort Dhún na nGall a fhógairt gur féidir le gach paisinéir
  a thaistealaíonn ar an dá eitilt sa lá go Baile Átha Cliath úsáid a bhaint
  as Conair na Nasceitiltí ag Aerfort Bhaile Átha Cliath. Is féidir le
  paisinéirí féin-nasctha, ag taisteal le bagáiste cábáin amháin, a gcéad
  Geata Imeachta eile a bhaint amach gan gá dhul tríd Rialú Inimirce agus
  Imréiteach Slándála arís.


  Dúirt Stiúrthóir Bainistíochta Aerfort Dhún na nGall, Eilís Docherty: "Is
  tionscnamh iontach é Conair na Nasceitiltí a bheith ar fáil do phaisinéirí a
  nascann le cinn scríbe ar fud an domhain trí Aerfort Bhaile Átha Cliath
  agus laghdóidh sé amanna scuaine ag Aerfort Bhaile Átha Cliath."
