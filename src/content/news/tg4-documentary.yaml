title: "\"Aerfort Dhún na nGall\" on TG4."
date: 2023-11-30
kind: Community
image: news-tg4-documentary.png
imagePosition: 50% 50%
lead: TG4's documentary series on the airport began airing.
body: >
  TG4's documentary series "Aerfort Dhún na nGall," following daily life and
  operations at Donegal Airport, began airing from 30 November 2023.
titleGa: Sraith ar TG4 faoi Aerfort Dhún na nGall.
kindGa: Pobal
leadGa: Chraol sraith faisnéise TG4 faoin aerfort ón 30 Samhain 2023.
bodyGa: >
  Sraith í seo faoi "Aerfort Dhún na nGall", an t-aerfort a vótáladh mar an
  bealach isteach aerfoirt is áille radhairc ar domhan. Cuireann an t-aerfort
  seirbhís ríthábhachtach ar fáil do chomaitéirí laethúla, úinéirí gnó, mic
  léinn, Rescue 118, daoine a bhíonn ag taisteal thar lear agus othair atá ag
  fáil cóir leighis riachtanach, ag ceangal lucht a úsáide leis an saol mór.


  Tabharfaidh an tsraith faisnéise 4 chlár seo, atá pearsanta agus macánta,
  léargas ar leith don lucht féachana ar mar a reáchtáiltear an t-aerfort
  beag réigiúnach seo trí scéalta pearsanta na bpaisinéirí a eitlíonn isteach
  agus amach agus scéalta fhoireann an aerfoirt atá freagrach as a
  shábháilteacht.
