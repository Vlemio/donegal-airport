title: First in Ireland to install ECAC EDS CB C3 screening.
date: 2022-06-07
kind: Operations
imagePosition: 50% 50%
lead: >-
  A new CT scanner means passengers no longer have to remove liquids or
  electronics from carry-on bags.
body: >
  Donegal Airport became the first airport in Ireland to install ECAC EDS CB
  C3 screening — a Smiths Detection HI-SCAN 6040 CTiX scanner using CT
  technology with automatic explosives-detection algorithms. Passengers no
  longer need to remove liquids, gels or electronic devices from carry-on
  bags, making the security checkpoint smoother and cutting the number of
  trays needed.
titleGa: An chéad aerfort in Éirinn le scagadh ECAC EDS CB C3 a shuiteáil.
kindGa: Oibríochtaí
leadGa: >-
  Ciallaíonn scanóir CT nua nach gá do phaisinéirí leachtanna nó fearas
  leictreonach a bhaint as bagáiste láimhe a thuilleadh.
bodyGa: >
  Ba é Aerfort Dhún na nGall an chéad aerfort in Éirinn le scagadh ECAC EDS CB
  C3 a shuiteáil — scanóir Smiths Detection HI-SCAN 6040 CTiX a úsáideann
  teicneolaíocht CT le halgartaim uathoibríocha um bhrath pléascán. Ní gá do
  phaisinéirí leachtanna, glóthaigh ná fearais leictreonacha a bhaint as
  bagáiste láimhe a thuilleadh, rud a dhéanann an pointe seiceála slándála
  níos réidhe agus a laghdaíonn líon na dtráidirí atá ag teastáil.
