title: Dublin route restored to twice-daily service.
date: 2026-05-08
kind: Operations
image: /photos/dublin-route-restored/image.jpg
imagePosition: 50% 50%
lead: >-
  After months of uncertainty, Donegal and Dublin are connected again — twice
  daily, with a contract locked to 2030.
body: >
  Emerald Airlines restored twice-daily service on the Donegal–Dublin route from
  1 May 2026. Both the morning and midday flights are back, following
  confirmation of a contract extension running through February 2030.


  The route had been in doubt since schedule changes were announced in January
  2025. It took sustained advocacy — from Deputies Pat the Cope Gallagher and
  Pearse Doherty, and direct involvement from Minister Darragh O'Brien — to
  secure the restoration.


  The significance goes beyond frequency. For many passengers, including those
  travelling to Dublin hospitals for cancer treatment, this route is not a
  convenience — it is a lifeline. Driving is not always an option.


  Multi-year certainty in the contract gives the airport, its staff, and the
  wider community something they have not had for a while: a solid foundation to
  plan from.
titleGa: Seirbhís faoi dhó sa lá athbhunaithe ar an mbealach go Baile Átha Cliath.
kindGa: Oibríochtaí
leadGa: >-
  Tar éis míonna d'éiginnteacht, tá Dún na nGall agus Baile Átha Cliath
  nasctha arís — faoi dhó sa lá, le conradh daingnithe go dtí 2030.
bodyGa: >
  D'athbhunaigh Emerald Airlines seirbhís faoi dhó sa lá ar an mbealach Dún na
  nGall–Baile Átha Cliath ón 1 Bealtaine 2026. Tá an eitilt maidine agus an
  eitilt lár lae ar ais araon, tar éis dearbhú a fháil go bhfuil síneadh
  conartha ar bun go Feabhra 2030.


  Bhí amhras faoin mbealach ó fógraíodh athruithe sceidil i mí Eanáir 2025.
  Bhí gá le hionchur leanúnach — ó na Teachtaí Dála Pat the Cope Ó Gallachóir
  agus Pearse Doherty, agus baint dhíreach ón Aire Darragh O'Brien — chun an
  t-athbhunú a bhaint amach.


  Téann an tábhacht níos faide ná an mhinicíocht. Do go leor paisinéirí, lena
  n-áirítear iad siúd atá ag taisteal go dtí ospidéil i mBaile Átha Cliath le
  cóireáil ailse, ní áisiúlacht atá sa bhealach seo — is slánchosaint í. Ní
  bhíonn an rogha tiomána indéanta i gcónaí.


  Tugann cinnteacht ilbhliantúil an chonartha rud don aerfort, dá fhoireann,
  agus don phobal i gcoitinne nach raibh acu le tamall: bonn daingean le
  pleanáil as.
