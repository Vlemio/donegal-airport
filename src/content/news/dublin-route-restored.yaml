title: Dublin route restored to twice-daily service.
date: 2026-05-08
kind: Operations
image: news-dublin-route.jpg
imagePosition: 50% 50%
lead: After months of uncertainty, Donegal and Dublin are connected again — twice daily, with a contract locked to 2030.
body: |
  Emerald Airlines restored twice-daily service on the Donegal–Dublin route from 1 May 2026. Both the morning and midday flights are back, following confirmation of a contract extension running through February 2030.

  The route had been in doubt since schedule changes were announced in January 2025. It took sustained advocacy — from Deputies Pat the Cope Gallagher and Pearse Doherty, and direct involvement from Minister Darragh O'Brien — to secure the restoration.

  The significance goes beyond frequency. For many passengers, including those travelling to Dublin hospitals for cancer treatment, this route is not a convenience — it is a lifeline. Driving is not always an option.

  Multi-year certainty in the contract gives the airport, its staff, and the wider community something they have not had for a while: a solid foundation to plan from.
