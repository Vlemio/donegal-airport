title: Local student's winning design becomes the face of Café Carraigfhinne.
date: 2026-07-16
kind: Community
image: news-cafe-logo-competition.jpg
imagePosition: 50% 20%
lead: A Gaoth Dobhair student's café logo design is now on display at Café Carraigfhinne — chosen from entries by local schoolchildren.
body: >
  Donegal Airport welcomed Abby, a pupil at Scoil Phádraig, Dobhar, along with
  her family and friends, to celebrate her winning design in the Café
  Carraigfhinne Logo Design Competition — an open call inviting local
  schoolchildren to design a logo for the airport café. Her design is now on
  display at Café Carraigfhinne.


  Abby's design draws on her own family's connection to the airport. "My dad
  travels a lot for work and always has a cup of coffee before his flight. My
  mum came up with the idea of including the beach because the airport is
  located right beside one," she said. "I'm really proud of my design."


  Donegal Airport thanked everyone who entered, calling the standard of the
  competition exceptional, and invites travellers to see Abby's logo for
  themselves next time they're through Café Carraigfhinne.
titleGa: Deartha ag dalta áitiúil, anois mar aghaidh Café Carraigfhinne.
kindGa: Pobal
leadGa: >-
  Tá lógó de chuid dalta ó Ghaoth Dobhair ar taispeáint anois i gCaifé
  Carraigfhinne — roghnaithe as iontrálacha ó dhaltaí scoile áitiúla.
bodyGa: >
  Chuir Aerfort Dhún na nGall fáilte roimh Abby, dalta i Scoil Phádraig, Dobhar,
  mar aon lena teaghlach agus a cairde, chun ceiliúradh a dhéanamh ar a
  dearadh buacach i gComórtas Deartha Lógó Chaifé Carraigfhinne — comórtas
  oscailte ag tabhairt cuireadh do dhaltaí scoile áitiúla lógó a dhearadh don
  chaifé san aerfort. Tá a dearadh ar taispeáint anois i gCaifé Carraigfhinne.


  Tá dearadh Abby bunaithe ar cheangal a teaghlaigh féin leis an aerfort.
  "Bíonn m'athair ag taisteal go minic don obair agus bíonn cupán caife aige i
  gcónaí sula n-eitlíonn sé. Tháinig mo mháthair aníos leis an smaoineamh an
  trá a chur san áireamh mar go bhfuil an t-aerfort suite díreach in aice
  léi," a dúirt sí. "Tá an-bhród orm as mo dhearadh."


  Ghabh Aerfort Dhún na nGall buíochas le gach duine a chuir isteach ar an
  gcomórtas, ag rá go raibh caighdeán an chomórtais eisceachtúil, agus tugann
  cuireadh do thaistealaithe lógó Abby a fheiceáil dóibh féin an chéad uair
  eile a bhíonn siad ag dul trí Chaifé Carraigfhinne.
