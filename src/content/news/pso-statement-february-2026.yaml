title: Donegal ⇄ Dublin PSO statement.
date: 2026-02-10
kind: Operations
image: news-pso-statement-february-2026.jpg
imagePosition: 50% 50%
lead: >-
  A new PSO contract removed the overnight aircraft and midday flights the
  route had run for 21 years — the board called it "extremely disappointing."
body: >
  Donegal Airport's leadership confirmed that the Department of Transport had
  signed a new Public Service Obligation contract despite the airport's
  request for a delay. The new contract ended overnight aircraft basing at
  Donegal — a practice in place for 21 years — and removed the midday
  flights, replacing them with a 6:30am arrival and an 8:30pm departure.


  The airport board said they were "extremely disappointed" and sought legal
  advice. A subsequent update confirmed the overnighting aircraft and midday
  flights would be restored from 1 May 2026.
titleGa: Ráiteas PSO Dhún na nGall ⇄ Bhaile Átha Cliath
kindGa: Oibríochtaí
leadGa: >-
  Shínigh an Roinn Iompair conradh PSO nua a bhain an t-eitleán oíche agus na
  heitiltí meán lae a bhí ar an mbealach le 21 bliain — dúirt an Bord go raibh
  siad "an-díomá go deo."
bodyGa: >
  Dheimhnigh Cathaoirleach, Bord Stiúrthóirí agus Bainistíocht Aerfort Dhún na
  nGall gur chuir an Roinn Iompair in iúl dóibh go raibh sé ar intinn acu
  conradh nua a chur i gcrích do bhealach PSO Dhún na nGall-Baile Átha Cliath
  le Emerald Airlines, in ainneoin gur iarr an tAerfort i scríbhinn ar an Aire
  Iompair gan an conradh a fheidhmiú go dtí go mbeadh comhairle dlí tugtha i
  gcrích maidir leis an ábhar.


  Ní bheadh an t-eitleán lonnaithe thar oíche in Aerfort Dhún na nGall a
  thuilleadh, rud a bhí amhlaidh don 21 bhliain roimhe sin, ná ní bheadh na
  heitiltí meán lae ar fáil a thuilleadh — ina n-ionad, bheadh eitilt 6.30
  a.m. ag teacht ó Bhaile Átha Cliath agus eitilt 8.30 p.m. ag fágáil Dhún na
  nGall.


  Dúirt an Bord go raibh siad "an-díomá go deo" agus lorg siad comhairle dlí.
  Dheimhnigh nuashonrú ina dhiaidh sin go n-athbhunófaí an t-eitleán oíche
  agus na heitiltí meán lae ón 1 Bealtaine 2026.
