title: "World's most scenic airport, three years running."
date: 2021-02-11
kind: Awards
image: news-scenic-airport-2020.jpg
imagePosition: 50% 50%
lead: PrivateFly's 2020 poll ranked Donegal the world's most scenic airport landing.
body: >
  PrivateFly's 2020 ranking of the world's most scenic airports placed
  Donegal at the top for the third consecutive year, with voters citing the
  stunning, varied scenery on approach — beaches, and sweeping views of
  Mount Errigal and The Rosses.
titleGa: An t-aerfort is áille ar domhan, an tríú bliain as a chéile.
kindGa: Dámhachtainí
leadGa: >-
  Rangaigh pobalbhreith PrivateFly 2020 Dún na nGall mar an tuirlingt
  aerfoirt is áille ar domhan.
bodyGa: >
  Chuir rangú PrivateFly 2020 de na haerfoirt is áille ar domhan Dún na nGall
  ar bharr an liosta don tríú bliain as a chéile, le vótálaithe ag lua an
  radharc iontach, éagsúil ar an gcur chuige — tránna, agus radhairc
  fhairsinge ar Shliabh an Earagail agus na Rosa.
