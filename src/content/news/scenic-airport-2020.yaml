title: "World's most scenic airport, three years running."
date: 2021-02-11
kind: Awards
image: news-scenic-airport-2020.jpg
imagePosition: 50% 50%
lead: PrivateFly's 2020 poll ranked Donegal the world's most scenic airport landing.
body: >
  PrivateFly's 2020 ranking of the world's most scenic airports placed
  Donegal at the top for the third consecutive year, with voters citing the
  stunning, varied scenery on approach — beaches, and sweeping views of
  Mount Errigal and The Rosses.
