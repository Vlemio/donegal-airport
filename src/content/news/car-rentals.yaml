title: Car rentals made easy.
date: 2025-01-26
kind: Operations
image: news-car-rentals.jpg
imagePosition: 50% 50%
lead: Four car rental desks operate right at the terminal.
body: >
  Donegal Airport works with four car rental partners based at the terminal —
  Enterprise Rent-A-Car, Europcar, Yuko Car and GoCar. Booking ahead is
  recommended to make sure a vehicle is available on arrival.
titleGa: Cuir carr ar cíos go héasca.
kindGa: Oibríochtaí
leadGa: Tá ceithre dheasc cíosa cairr ag feidhmiú díreach sa teirminéal.
bodyGa: >
  Oibríonn Aerfort Dhún na nGall le ceithre chomhpháirtí cíosa cairr atá
  lonnaithe sa teirminéal — Enterprise Rent-A-Car, Europcar, Yuko Car agus
  GoCar. Moltar áirithint a dhéanamh roimh ré lena chinntiú go mbeidh
  feithicil ar fáil ar theacht i dtír duit.
