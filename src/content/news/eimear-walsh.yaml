lead: A TUS Athlone graduate has joined the airport as Marketing Graduate.
body: >
  Donegal Airport welcomed Eimear Walsh to the team as its new Marketing
  Graduate. A recent graduate of TUS Athlone, Eimear brings fresh perspective
  and energy to the airport's marketing work.
