title: Meet our new team member — Eimear Walsh.
date: 2025-10-02
kind: Community
image: news-eimear-walsh.png
imagePosition: 50% 50%
lead: A TUS Athlone graduate has joined the airport as Marketing Graduate.
body: >
  Donegal Airport welcomed Eimear Walsh to the team as its new Marketing
  Graduate. A recent graduate of TUS Athlone, Eimear brings fresh perspective
  and energy to the airport's marketing work.
titleGa: Ár mball foirne nua a chur in aithne
kindGa: Pobal
leadGa: >-
  Tá céimí le déanaí ó TUS Baile Átha Luain tar éis teacht isteach san aerfort
  mar Ghrádaitheoir Margaíochta.
bodyGa: >
  Cuireadh fáilte roimh Eimear Walsh chuig foireann Aerfort Dhún na nGall mar
  Ghrádaitheoir Margaíochta nua. Is céimí le déanaí í ó Ollscoil Teicneolaíochta
  na Sionainne, Baile Átha Luain (TUS Athlone). Tá smaointe úra agus fuinneamh
  ag teacht léi, agus is mór an ríméad í a bheith anois mar chuid dár
  bhfoireann.
