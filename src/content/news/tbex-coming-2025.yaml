title: TBEX coming to Donegal!
date: 2025-01-24
kind: Community
image: news-tbex-coming-2025.png
imagePosition: 50% 50%
lead: >-
  The global Travel Bloggers Exchange conference was announced for ATU
  Letterkenny.
body: >
  Donegal Airport announced it would sponsor TBEX — the Travel Bloggers
  Exchange, a global gathering of travel writers and content creators — at
  its ATU Letterkenny edition later in the year.
