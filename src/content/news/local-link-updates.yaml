title: TFI Local Link — Donegal, Sligo & Leitrim updates.
date: 2025-01-29
kind: Operations
image: news-local-link-updates.png
imagePosition: 50% 50%
lead: Local Link bus services have increased their stops at Donegal Airport.
body: >
  TFI Local Link bus services now stop more frequently at Donegal Airport.
  Travellers can check the latest timetables at locallinkdsl.ie/timetables/.
titleGa: "TFI Local Link: nuashonruithe do Dhún na nGall, Sligeach agus Liatroim."
kindGa: Oibríochtaí
leadGa: >-
  Tá méadú tagtha ar líon na stadanna a dhéanann seirbhísí bus Local Link ag
  Aerfort Dhún na nGall.
bodyGa: >-
  Stadann seirbhísí bus TFI Local Link ag Aerfort Dhún na nGall níos minice
  anois. Is féidir le taistealaithe na sceidil is déanaí a sheiceáil ag
  locallinkdsl.ie/timetables/.
