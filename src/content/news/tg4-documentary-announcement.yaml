title: "TG4 documentary series \"Aerfort Dhún na nGall\" announced."
date: 2023-11-17
kind: Community
image: news-tg4-documentary-announcement.png
imagePosition: 50% 50%
lead: The airport announced a new TG4 documentary series about its daily life.
body: >
  Donegal Airport announced that TG4's documentary series "Aerfort Dhún na
  nGall" would begin airing from 30 November 2023, offering an inside look at
  the airport's operations and the people who run them.
titleGa: 'Fógra: sraith faisnéise TG4 "Aerfort Dhún na nGall".'
kindGa: Pobal
leadGa: >-
  D'fhógair an t-aerfort sraith faisnéise nua TG4 faoina shaol laethúil.
bodyGa: >
  Ba mhaith le bainistíocht agus foireann Aerfort Dhún na nGall a fhógairt go
  bhfuil an tsraith clár faisnéise úr TG4 á heisiúint gan mhoill, darbh ainm
  "Aerfort Dhún na nGall". Is sraith í seo ina gcuirtear scéal an aerfoirt in
  iúl trí shúile na foirne agus na bpaisinéirí a úsáideann é go laethúil.


  Craolfar "Aerfort Dhún na nGall" ar an Déardaoin 30 Samhain ag 8in, le
  heipeasóid úr gach Déardaoin ina dhiaidh sin ar TG4.
