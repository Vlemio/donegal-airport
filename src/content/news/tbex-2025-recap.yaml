title: TBEX (Travel Bloggers Exchange) 2025.
date: 2025-10-02
kind: Community
image: news-tbex-2025-recap.png
imagePosition: 50% 50%
lead: >-
  Donegal Airport sponsored the global travel-writers' gathering, held at ATU
  Letterkenny.
body: >
  TBEX — a global gathering of travel writers, bloggers and content creators —
  came to ATU Letterkenny, and Donegal Airport sponsored the conference to
  help promote the region as a travel destination. Colleague Pauline attended
  on the airport's behalf.
