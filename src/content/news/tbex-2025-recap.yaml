title: TBEX (Travel Bloggers Exchange) 2025.
date: 2025-10-02
kind: Community
image: news-tbex-2025-recap.png
imagePosition: 50% 50%
lead: >-
  Donegal Airport sponsored the global travel-writers' gathering, held at ATU
  Letterkenny.
body: >
  TBEX — a global gathering of travel writers, bloggers and content creators —
  came to ATU Letterkenny, and Donegal Airport sponsored the conference to
  help promote the region as a travel destination. Colleague Pauline attended
  on the airport's behalf.
titleGa: TBEX (Travel Bloggers Exchange) 2025
kindGa: Pobal
leadGa: >-
  Rinne Aerfort Dhún na nGall urraíocht ar chruinniú domhanda na
  scríbhneoirí taistil, a reáchtáladh in OTA Leitir Ceanainn.
bodyGa: >
  D'fhreastail ár gcomhghleacaí, Pauline, ar imeacht TBEX (Travel Bloggers
  Exchange) in Ollscoil Teicneolaíochta an Atlantaigh, Leitir Ceanainn (OTA)
  i mbliana — cruinniú domhanda de scríbhneoirí taistil, blagálaithe, agus
  cruthaitheoirí ábhair. Bhí bród ar Aerfort Dhún na nGall a bheith i
  láthair, agus urraíocht a thabhairt don imeacht fosta, ag cur béime ar ár
  dtiomantas Dún na nGall a chur chun cinn mar cheann scríbe taistil den
  chéad scoth.
