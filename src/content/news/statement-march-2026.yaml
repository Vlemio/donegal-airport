title: Donegal Airport statement — 9 March 2026.
date: 2026-03-09
kind: Operations
image: news-statement-march-2026.jpg
imagePosition: 50% 50%
lead: >-
  Airport leadership met the Department of Transport to oppose a revised
  schedule that would have cut the afternoon Dublin flight.
body: >
  Donegal Airport's leadership met with Department of Transport officials to
  oppose a revised flight schedule due to take effect on 29 March 2026, which
  would have removed the afternoon Dublin flight and ended the practice of
  basing an aircraft overnight at Donegal.


  Department officials said they were bound by procurement rules, but
  confirmed they were negotiating with the airline to explore reinstating the
  previous schedule, with a decision expected within two weeks.
titleGa: "Ráiteas ó Aerfort Dhún na nGall: 9 Márta 2026."
kindGa: Oibríochtaí
leadGa: >-
  Bhuail ceannaireacht an aerfoirt leis an Roinn Iompair chun cur i gcoinne
  sceideal athbhreithnithe a bhainfeadh an eitilt tráthnóna go Baile Átha
  Cliath.
bodyGa: >
  Bhuail ceannaireacht Aerfort Dhún na nGall le hoifigigh na Roinne Iompair
  chun cur i gcoinne sceideal eitilte athbhreithnithe a bhí le teacht i
  bhfeidhm ar an 29 Márta 2026, rud a bhainfeadh an eitilt tráthnóna go Baile
  Átha Cliath agus a chuirfeadh deireadh leis an gcleachtas aerárthach a
  bhunú thar oíche i nDún na nGall.


  Dúirt oifigigh na Roinne go raibh siad faoi cheangal ag rialacha soláthair,
  ach dhearbhaigh siad go raibh siad ag caibidil leis an aerlíne chun an
  seansceideal a athbhunú a fhiosrú, le cinneadh ag súil laistigh de
  choicís.
