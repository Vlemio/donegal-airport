title: Loganair year-round service to Donegal takes flight.
date: 2024-05-24
kind: Operations
image: news-loganair-year-round-2024.jpg
imagePosition: 50% 50%
lead: >-
  Up to three flights a week connect Donegal and Glasgow through the season,
  dropping to twice weekly for winter.
body: >
  Loganair's Glasgow–Donegal route, relaunched in 2023, now runs year-round —
  up to three flights weekly for most of the season, moving to a twice-weekly
  Friday/Sunday winter schedule from 28 October. The airline has served the
  Scotland–Ireland connection since the early 1990s.


  Fares include a 21kg baggage allowance, inflight refreshments and
  children's discounts, alongside a mandatory carbon-offset charge through
  Loganair's GreenSkies programme.
