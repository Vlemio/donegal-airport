title: Loganair year-round service to Donegal takes flight.
date: 2024-05-24
kind: Operations
image: news-loganair-year-round-2024.jpg
imagePosition: 50% 50%
lead: >-
  Up to three flights a week connect Donegal and Glasgow through the season,
  dropping to twice weekly for winter.
body: >
  Loganair's Glasgow–Donegal route, relaunched in 2023, now runs year-round —
  up to three flights weekly for most of the season, moving to a twice-weekly
  Friday/Sunday winter schedule from 28 October. The airline has served the
  Scotland–Ireland connection since the early 1990s.


  Fares include a 21kg baggage allowance, inflight refreshments and
  children's discounts, alongside a mandatory carbon-offset charge through
  Loganair's GreenSkies programme.
titleGa: Seirbhís bhliantúil Loganair go Dún na nGall ar eiteal.
kindGa: Oibríochtaí
leadGa: >-
  Nascann suas le trí eitilt in aghaidh na seachtaine Dún na nGall agus
  Glaschú i rith an tséasúir, ag titim go dtí faoi dhó sa tseachtain don
  gheimhreadh.
bodyGa: >
  Ritheann bealach Loganair idir Glaschú agus Dún na nGall, a athsheoladh in
  2023, ar feadh na bliana anois — suas le trí eitilt sa tseachtain den chuid
  is mó den séasúr, ag bogadh go sceideal geimhridh Dé hAoine/Dé Domhnaigh
  faoi dhó sa tseachtain ón 28 Deireadh Fómhair. Tá an t-aerlíne ag freastal
  ar an nasc idir Albain agus Éirinn ó thús na 1990idí.


  Cuimsíonn na táillí liúntas bagáiste 21kg, sólaistí ar eitilt agus lascainí
  do pháistí, chomh maith le táille éigeantach fritháirimh charbóin trí chlár
  GreenSkies Loganair.
