title: Scoil Gheimhridh winter school returns for a 17th year.
date: 2026-03-03
kind: Community
image: /photos/scoil-gheimhridh/image.png
imagePosition: 65% 38%
lead: >-
  Every year between Christmas and New Year, Gweedore becomes the centre of
  traditional Irish music.
body: >
  Scoil Gheimhridh Ghaoth Dobhair runs from 27 December through 1 January in the
  heart of Donegal's Gaeltacht — a winter gathering of musicians, Irish
  speakers, and enthusiasts that has grown into one of the most loved events in
  the cultural calendar.


  The programme spans concerts, live sessions, workshops, and album launches,
  all set in the Irish-speaking community of Gweedore where the language and the
  music remain closely bound. Many participants travel specifically for the
  school, and Donegal Airport is the arrival point for those flying in.


  The school is one of several cultural landmarks anchoring Donegal's year.
  Earagail Arts Festival runs 12–26 July, followed by the Mary Dungloe Festival
  from 26 July to 4 August.


  Registration details for the next edition are announced through the organisers
  ahead of the December programme.
titleGa: Scoil Gheimhridh Ghaoth Dobhair
kindGa: Pobal
leadGa: >-
  Gach bliain idir an Nollaig agus an Bhliain Úr, is é Gaoth Dobhair croílár an
  cheoil thraidisiúnta.
bodyGa: >
  27 Nollaig – 1 Eanáir. Ceiliúraigh draíocht na ceoil traidisiúnta i gcroílár
  Ghaeltacht Dhún na nGall. Bain taitneamh as ceolchoirmeacha, seisiúin
  bhríomhara, ceardlanna agus seolta albaim le ceoltóirí Gaelacha. Bealach ar
  dóigh chun scíth a ligean tar éis na Nollag agus an Bhliain Úr a cheiliúradh
  go galánta!


  Tá go leor rannpháirtithe ag taisteal go sonrach don scoil, agus is é
  Aerfort Dhún na nGall an pointe teachta dóibh siúd atá ag eitilt isteach.
  Is ceann de roinnt cuspóirí cultúrtha a chuireann bonn faoi bhliain Dhún na
  nGall an scoil seo — reáchtálfar Féile Ealaíon Earagail ón 12–26 Iúil, agus
  Féile Mháire Dhún na nGall ina dhiaidh sin ón 26 Iúil go dtí an 4 Lúnasa.
